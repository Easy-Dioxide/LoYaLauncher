name: Release

# 推送 v* 标签时自动构建三平台安装包并创建 GitHub Release。
# asset 命名约定必须与 LoyaLauncher.Pack/UpdateService.PickAssetForPlatform 保持一致：
#   LoyaLauncher-win-x64.zip / LoyaLauncher-linux-x64.zip
#   LoyaLauncher-osx-x64.zip / LoyaLauncher-osx-arm64.zip
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    name: publish (${{ matrix.rid }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
          - rid: linux-x64
            os: ubuntu-latest
          - rid: osx-x64
            os: macos-latest
          - rid: osx-arm64
            os: macos-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # 从 tag 提取版本号（v0.4.0 → 0.4.0）注入构建：
      # 否则 Directory.Build.props 的 0.1.0 会被打进发布包，
      # 标题栏版本显示与自动更新比较都会错乱
      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publish ${{ matrix.rid }}
        run: >
          dotnet publish src/LoyaLauncher.App/LoyaLauncher.App.csproj
          --configuration Release
          --runtime ${{ matrix.rid }}
          --self-contained true
          -p:Version=${{ env.VERSION }}
          --output ./publish/${{ matrix.rid }}

      - name: Package zip (Windows)
        if: matrix.rid == 'win-x64'
        shell: pwsh
        run: Compress-Archive -Path "publish/${{ matrix.rid }}/*" -DestinationPath "LoyaLauncher-${{ matrix.rid }}.zip" -Force

      - name: Package zip (Unix)
        if: matrix.rid != 'win-x64'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          zip -qr "../../LoyaLauncher-${{ matrix.rid }}.zip" .

      - name: Package single-file exe (Windows)
        if: matrix.rid == 'win-x64'
        shell: bash
        run: |
          dotnet publish src/LoyaLauncher.App/LoyaLauncher.App.csproj \
            --configuration Release --runtime win-x64 --self-contained true \
            -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true \
            -p:EnableCompressionInSingleFile=true -p:DebugSymbols=false -p:DebugType=none \
            -p:Version=${{ env.VERSION }} \
            --output ./single
          mv single/LoyaLauncher.App.exe "LoyaLauncher-${{ matrix.rid }}-single.exe"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: LoyaLauncher-${{ matrix.rid }}
          path: |
            LoyaLauncher-${{ matrix.rid }}.zip
            LoyaLauncher-${{ matrix.rid }}-single.exe

  release:
    name: create release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 从 tag 提取版本号，与 publish job 保持一致
      - name: Extract version from tag
        shell: bash
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      # 源码打包：git archive 只含 HEAD 跟踪文件（自动排除 bin/obj 等未跟踪产物），
      # 与平台安装包一同作为 Release 资产推送
      - name: Package source code
        shell: bash
        run: |
          git archive --format=zip \
            --prefix=LoyaLauncher-src-${{ env.VERSION }}/ \
            -o "LoyaLauncher-src-${{ env.VERSION }}.zip" HEAD

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      # 清单 §8：发布产物必须带 SHA-256 清单，客户端（UpdateService.PickChecksumAsset）
      # 按"同名 .sha256 资产 → SHA256SUMS 资产 → Release Notes"的顺序查找期望值。
      # 源码包（-src-）不参与自动更新校验。
      - name: Generate SHA-256 checksums
        shell: bash
        run: |
          cd artifacts
          : > SHA256SUMS
          for f in LoyaLauncher-*.zip; do
            [ -e "$f" ] || continue
            case "$f" in *-src-*) continue ;; esac
            h=$(sha256sum "$f" | awk '{print $1}')
            printf '%s  %s\n' "$h" "$f" >> SHA256SUMS
            printf '%s  %s\n' "$h" "$f" > "$f.sha256"
          done
          cat SHA256SUMS

      # Release Notes 前段嵌入校验表：手动下载的用户也能核对，
      # UpdateService.ExtractShaFromNotes 也会读取这里的哈希
      - name: Compose release notes prefix
        shell: bash
        run: |
          {
            echo "## SHA-256 校验"
            echo ""
            echo '```'
            cat artifacts/SHA256SUMS
            echo '```'
            echo ""
          } > release-notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release-notes.md
          files: |
            artifacts/*
            LoyaLauncher-src-${{ env.VERSION }}.zip
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
